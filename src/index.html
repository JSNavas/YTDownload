<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTDownload</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ───────────────────────────────────────────────── barra superior -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="gBadge" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#4f8ef7"/>
              <stop offset=".5" stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#d946ef"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#gBadge)"/>
          <g fill="none" stroke="#0b0b12" stroke-width="7.5"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M31 24 L50 42"/>
            <path d="M69 24 L50 42"/>
            <path d="M50 42 V80"/>
            <path d="M35 53 H65"/>
            <path d="M50 53 C71 53 71 80 50 80"/>
          </g>
        </svg>
        <span class="brand-name">YTDownload</span>
      </div>

      <div class="topbar-right">
        <div id="tools"></div>
        <button id="open-settings" class="icon-btn" title="Ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <!-- ─────────────────────────────────────────────────── entrada URL -->
      <section class="card hero">
        <label class="lbl" for="url" data-i18n="pasteLabel"></label>
        <div class="row">
          <input id="url" type="text" spellcheck="false" autocomplete="off"
                 placeholder="https://www.youtube.com/playlist?list=…" />
          <button id="probe" class="btn primary" data-i18n="analyze"></button>
        </div>
        <p id="probe-msg" class="msg"></p>
      </section>

      <!-- ──────────────────────────────────────────── resultado + opciones -->
      <section id="info" class="card hidden">
        <button id="clear-probe" class="icon-btn card-close" title="" aria-label="">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="info-row">
          <div class="thumb-wrap"><img id="thumb" alt="" /></div>
          <div class="info-text">
            <span id="kind" class="badge grad"></span>
            <h2 id="title"></h2>
            <p id="meta" class="dim"></p>
          </div>
        </div>

        <div id="scope-block" class="opt hidden">
          <span class="opt-label" data-i18n="whatToDownload"></span>
          <div class="seg">
            <label><input type="radio" name="scope" value="video" checked />
              <span id="scope-video"></span></label>
            <label><input type="radio" name="scope" value="playlist" />
              <span id="scope-list"></span></label>
          </div>
        </div>

        <div id="folder-block" class="hidden opt">
          <label class="check">
            <input type="checkbox" id="use-folder" />
            <span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6"/></svg></span>
            <span data-i18n="useSubfolder"></span>
          </label>
          <input id="folder" type="text" spellcheck="false" disabled />
        </div>

        <div class="opt">
          <span class="opt-label" data-i18n="format"></span>
          <div class="seg">
            <label><input type="radio" name="fmt" value="mp3" checked />
              <span data-i18n="fmtMp3"></span></label>
            <label><input type="radio" name="fmt" value="video" />
              <span data-i18n="fmtVideo"></span></label>
          </div>
        </div>

        <div class="opt">
          <span class="opt-label" id="q-label"></span>
          <div class="select-wrap">
            <select id="quality"></select>
            <svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
          </div>
        </div>

        <div class="opt">
          <span class="opt-label" data-i18n="saveTo"></span>
          <div class="row">
            <input id="dest" type="text" spellcheck="false" />
            <button id="pick" class="btn" data-i18n="change"></button>
          </div>
          <p class="hint"><span data-i18n="finalPath"></span> <code id="target"></code></p>
        </div>

        <div class="actions">
          <button id="go" class="btn primary big" data-i18n="addToQueue"></button>
          <button id="go-later" class="btn big" data-i18n="addLater"></button>
        </div>
      </section>

      <!-- ────────────────────────────────────────────────────────── cola -->
      <section id="queue-section" class="card">
        <nav class="tabs" id="tabs">
          <button class="tab active" data-filter="all">
            <span data-i18n="tabAll"></span><b id="c-all">0</b></button>
          <button class="tab" data-filter="queued">
            <span data-i18n="tabQueued"></span><b id="c-queued">0</b></button>
          <button class="tab" data-filter="downloading">
            <span data-i18n="tabDownloading"></span><b id="c-downloading">0</b></button>
          <button class="tab" data-filter="later">
            <span data-i18n="tabLater"></span><b id="c-later">0</b></button>
          <button class="tab" data-filter="done">
            <span data-i18n="tabCompleted"></span><b id="c-done">0</b></button>
          <button class="tab" data-filter="failed">
            <span data-i18n="tabFailed"></span><b id="c-failed">0</b></button>
        </nav>

        <div class="toolbar">
          <label class="check small" id="sel-all-label">
            <input type="checkbox" id="sel-all" />
            <span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6"/></svg></span>
            <span data-i18n="selectAll"></span>
          </label>
          <span class="sep" id="tb-sep"></span>
          <button id="start" class="btn primary sm" data-i18n="startAll"></button>
          <button id="start-later" class="btn primary sm" data-i18n="downloadNow"></button>
          <button id="retry-failed" class="btn sm" data-i18n="retryFailed"></button>
          <button id="clear-done" class="btn sm" data-i18n="clearCompleted"></button>
          <button id="clear-failed" class="btn sm ghost-danger" data-i18n="clearFailed"></button>
          <button id="remove-sel" class="btn sm ghost-danger" data-i18n="removeSelected"></button>
          <button id="cancel-all" class="btn sm danger hidden" data-i18n="cancelAll"></button>
        </div>

        <div id="overall" class="overall hidden">
          <div class="bar"><div id="overall-fill"></div></div>
          <span id="overall-txt" class="dim"></span>
        </div>

        <ul id="list" class="queue"></ul>
        <p id="empty" class="empty dim" data-i18n="nothingHere"></p>
      </section>
    </main>

    <!-- ──────────────────────────────────────────────────────── ajustes -->
    <div id="settings" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3 data-i18n="settings"></h3>
          <button id="close-settings" class="icon-btn" aria-label="Cerrar">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="modal-body">
          <div class="opt">
            <span class="opt-label" data-i18n="language"></span>
            <div class="seg">
              <label><input type="radio" name="lang" value="es" />
                <span>Español</span></label>
              <label><input type="radio" name="lang" value="en" />
                <span>English</span></label>
            </div>
          </div>

          <div class="opt">
            <span class="opt-label" data-i18n="simultaneous"></span>
            <div class="slider-row">
              <input type="range" id="conc" min="1" max="10" step="1" value="3" />
              <output id="conc-out">3</output>
            </div>
            <p class="hint" data-i18n="simultaneousHint"></p>
          </div>

          <div class="opt">
            <span class="opt-label" data-i18n="defaultFolderAudio"></span>
            <div class="row">
              <input id="def-dest-mp3" type="text" spellcheck="false" />
              <button id="pick-def-mp3" class="btn" data-i18n="change"></button>
            </div>
          </div>

          <div class="opt">
            <span class="opt-label" data-i18n="defaultFolderVideo"></span>
            <div class="row">
              <input id="def-dest-video" type="text" spellcheck="false" />
              <button id="pick-def-video" class="btn" data-i18n="change"></button>
            </div>
            <p class="hint" data-i18n="defaultFolderHint"></p>
          </div>

          <div class="opt">
            <span class="opt-label" data-i18n="history"></span>
            <button id="clear-history" class="btn ghost-danger" data-i18n="clearHistory"></button>
            <p class="hint" data-i18n="historyHint"></p>
          </div>

          <div class="opt">
            <span class="opt-label" data-i18n="version"></span>
            <div class="row">
              <button id="check-updates" class="btn" data-i18n="checkUpdates"></button>
            </div>
            <p id="upd-msg" class="hint"></p>
          </div>

          <div class="about">
            <p><b>YTDownload</b> <span id="app-ver" class="dim"></span></p>
            <p class="dim" data-i18n="aboutLine"></p>
            <p id="about-tools" class="dim"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>
    <script src="main.js"></script>
  </body>
</html>
