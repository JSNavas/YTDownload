name: Release

# Tag a commit to publish installers:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS (Apple Silicon)
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS (Intel)
          - os: ubuntu-22.04
            args: ""
            name: Linux
          - os: windows-latest
            args: ""
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma cada bundle. Sin esto la app rechaza la actualización, que
          # es justo lo que queremos: solo instala lo firmado con esta clave.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Publica latest.json, el archivo que la app consulta para saber
          # si hay versión nueva y de dónde bajarla.
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: "YTDownload ${{ github.ref_name }}"
          releaseBody: |
            ## Install

            Download the file for your system below.

            **You also need `yt-dlp` and `ffmpeg`:**
            ```bash
            # macOS
            brew install yt-dlp ffmpeg
            # Debian/Ubuntu
            sudo apt install ffmpeg && sudo pipx install yt-dlp
            # Windows
            winget install yt-dlp.yt-dlp Gyan.FFmpeg
            ```

            **First launch on macOS.** These builds are not signed or
            notarised by Apple, so macOS blocks them once. Drag the app to
            Applications, try to open it, then go to **System Settings →
            Privacy & Security** and click **Open Anyway** next to the
            message about YTDownload.

            Terminal equivalent, if you prefer:
            ```bash
            xattr -dr com.apple.quarantine /Applications/YTDownload.app
            ```

            See the full changelog below.
          # Se queda en borrador hasta que TODAS las plataformas terminen:
          # lo publica el job de abajo. Así nadie se descarga un release a
          # medias si una de las cuatro falla.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    # needs espera a los cuatro jobs de la matriz y solo sigue si todos
    # terminaron bien. Si alguno falla, el release se queda en borrador.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mark the release as published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
