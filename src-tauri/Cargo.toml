[package]
name = "ytdownload"
version = "0.1.6"
description = "YouTube downloader: playlists and videos, MP3 or MP4"
authors = ["YTDownload contributors"]
edition = "2021"

[lib]
name = "ytdownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync"] }
dirs = "5"

[profile.release]
# "thin" conserva casi toda la optimización de un LTO completo y enlaza
# mucho más rápido; codegen-units > 1 además paraleliza. El coste es un
# binario algo mayor, irrelevante en una app de ~4 MB que ni siquiera
# empaqueta yt-dlp ni ffmpeg.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
