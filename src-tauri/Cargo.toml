[package]
name = "ytdownload"
version = "0.1.1"
description = "YouTube downloader: playlists and videos, MP3 or MP4"
authors = ["YTDownload contributors"]
edition = "2021"

[lib]
name = "ytdownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync"] }
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
